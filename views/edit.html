{% extends "admin_base.html" %}
{% block title %}Edit submission #{{ id }} — Overdue Progress{% endblock %}
{% block body %}
    <main class="dash article">
      <p class="crumbs"><a href="/admin">Submissions</a> / Edit</p>
      <h1>Edit submission <span class="muted-id">#{{ id }}</span></h1>

      {% if flash %}
        <div class="flash">{{ flash }}</div>
      {% endif %}

      <form class="form" method="post" action="/admin/submissions/{{ id }}/edit">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

        <label for="title">
          Title
          <input
            type="text"
            id="title"
            name="title"
            required
            maxlength="200"
            value="{{ values.title }}"
          />
        </label>

        <label for="description">
          Description
          <textarea
            id="description"
            name="description"
            required
            maxlength="2000"
          >{{ values.description }}</textarea>
        </label>

        <label for="author">
          Author
          <input
            type="text"
            id="author"
            name="author"
            required
            maxlength="200"
            value="{{ values.author }}"
          />
        </label>

        <label for="email">
          Email
          <input
            type="email"
            id="email"
            name="email"
            required
            maxlength="320"
            value="{{ values.email }}"
          />
        </label>

        <label for="link">
          Essay link
          <input
            type="url"
            id="link"
            name="link"
            required
            maxlength="2000"
            value="{{ values.link }}"
          />
        </label>

        <div class="actions">
          <button class="pill" type="submit">Save changes</button>
          <a class="more" href="/admin">Cancel</a>
          <a class="more" href="/admin/submissions/{{ id }}/history">View history</a>
        </div>
      </form>
    </main>
{% endblock %}
