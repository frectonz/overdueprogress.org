<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overdue Progress: {{ page_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        max-width: 680px;
        margin: 60px auto;
        padding: 0 24px;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 18px;
        line-height: 1.8;
        color: #222;
      }
      h1 {
        font-size: 32px;
        margin-bottom: 8px;
      }
      a {
        color: #222;
      }
      .lead {
        color: #444;
      }
      .back {
        font-size: 15px;
        color: #777;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 24px;
      }
      .cat {
        margin: 28px 0;
      }
      .cat-title {
        font-size: 21px;
        font-weight: 600;
      }
      .cat-title .count {
        color: #999;
        font-size: 15px;
        font-weight: 400;
      }
      .essay {
        margin: 16px 0;
      }
      .essay-title {
        font-weight: 600;
      }
      .essay-meta {
        color: #777;
        font-size: 15px;
      }
      .winners-banner {
        display: block;
        position: relative;
        left: 50%;
        width: 100vw;
        margin-left: -50vw;
        margin-top: -60px;
        margin-bottom: 40px;
        box-sizing: border-box;
        background: #1a1a1a;
        color: #fff;
        text-decoration: none;
        padding: 13px 24px;
        text-align: center;
        font-size: 16px;
        line-height: 1.5;
      }
      .winners-banner:hover {
        background: #000;
      }
      .winners-banner .label {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #f0c869;
        margin-right: 8px;
      }
      .winners-banner .cue {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
