<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overdue Progress: {{ page_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        max-width: 680px;
        margin: 60px auto;
        padding: 0 24px;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 18px;
        line-height: 1.8;
        color: #222;
      }
      h1 {
        font-size: 32px;
        margin-bottom: 8px;
      }
      a {
        color: #222;
      }
      .lead {
        color: #444;
      }
      .back {
        font-size: 15px;
        color: #777;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 24px;
      }
      .cat {
        margin: 28px 0;
      }
      .cat-title {
        font-size: 21px;
        font-weight: 600;
      }
      .cat-title .count {
        color: #999;
        font-size: 15px;
        font-weight: 400;
      }
      .essay {
        margin: 16px 0;
      }
      .essay-title {
        font-weight: 600;
      }
      .essay-meta {
        color: #777;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
